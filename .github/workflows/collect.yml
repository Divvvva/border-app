name: collect-border-queue

on:
  schedule:
    - cron: "*/15 * * * *"   # каждые 15 минут (GitHub может запускать с задержкой)
  workflow_dispatch:          # кнопка ручного запуска

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 pandas numpy
      - name: Collect
        env:
          NAKORDONI_API_KEY: ${{ secrets.NAKORDONI_API_KEY }}
          NAKORDONI_PPID_ENTRY: ${{ secrets.NAKORDONI_PPID_ENTRY }}
          NAKORDONI_PPID_EXIT: ${{ secrets.NAKORDONI_PPID_EXIT }}
          BELARUSBORDER_TOKEN: ${{ secrets.BELARUSBORDER_TOKEN }}
        run: python collector.py || echo "::warning::Сборщик не получил данных — смотри data/raw/"
      - name: Forecast my trips
        run: python predict_targets.py || echo "::warning::Прогноз на поездки не посчитался"
      - name: Commit data
        run: |
          git config user.name "border-bot"
          git config user.email "border-bot@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase --autostash || true
          git push
