name: collect-border-queue

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests beautifulsoup4 pandas numpy
      - name: Collect
        env:
          NAKORDONI_API_KEY: ${{ secrets.NAKORDONI_API_KEY }}
          NAKORDONI_PPID_ENTRY: ${{ secrets.NAKORDONI_PPID_ENTRY }}
          NAKORDONI_PPID_EXIT: ${{ secrets.NAKORDONI_PPID_EXIT }}
          BELARUSBORDER_TOKEN: ${{ secrets.BELARUSBORDER_TOKEN }}
        run: python collector.py || echo "::warning::No data collected"
      - name: Forecast my trips
        run: python predict_targets.py || echo "::warning::Trip forecast failed"
      - name: Commit data
        run: |
          git config user.name "border-bot"
          git config user.email "border-bot@users.noreply.github.com"
          for f in data/queue.csv data/forecast_log.csv; do
            [ -f "$f" ] && git add "$f"
          done
          git diff --cached --quiet && exit 0
          git commit -m "data $(date -u +%Y-%m-%dT%H:%M)"
          git push || (git pull --rebase --autostash && git push)
